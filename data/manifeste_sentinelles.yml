# ═══════════════════════════════════════════════════════════════════════════
# MANIFESTE DES SENTINELLES — v2 (07/08/2026) · lot SENTINELLE-01
#
# 🔴🔴 CE FICHIER EST UNE **DECLARATION**, PAS UN SCAN. Une sentinelle qui
# balaierait les workflows existants ne verrait jamais celui qui a disparu, ni
# celui qui n'a jamais tourne.
#   ⭐⭐⭐ « zero parce que c'est casse » et « zero parce qu'il n'y a rien »
#   se ressemblent sur le disque et sont l'inverse.
#
# ✅ PERIMETRE CLOS LE 07/08 — 53 EST DESORMAIS UN TOTAL, PLUS UN PLANCHER.
#    Preda a ouvert l'onglet Actions de `Predabot`, `veveid`,
#    `VeVePreda/VeVeWiki` et `VeVePreda/arena` : les quatre sont VIDES.
#    ⭐ Ce n'est pas mon miroir `github/` qui l'a dit — ses copies avaient
#    3 semaines a 3 mois et n'auraient prouve que leur propre age.
#
# ⭐⭐⭐ CE QUI EST VALIDE ET CE QUI NE L'EST PAS NE SE MELANGE PAS :
#    `valide_critique: true`  = Preda a dit oui (les 8 du 07/08).
#    `valide_fenetre: false`  = PERSONNE n'a valide les heures. Un « ok » sur
#    la criticite ne vaut pas approbation des fenetres, et laisser les deux
#    sous un seul drapeau ferait passer l'un pour l'autre.
#
# 🔴🔴 CHAMP `preuve` — MESURE DU 07/08 : **12 des 25 workflows a cron ne
#    committent QUE s'il y a un diff** (`git diff --cached --quiet && exit 0`).
#    Sans changement ils ne laissent AUCUNE trace d'ecriture. Une sentinelle
#    branchee sur les dates d'ecriture les declarerait morts alors qu'ils vont
#    bien — et CINQ d'entre eux sont critiques. ⭐⭐⭐ DE FAUSSES ALERTES SUR LES
#    LIGNES CRITIQUES SONT PIRES QUE PAS D'ALERTE : elles apprennent a ignorer
#    exactement ce qu'il fallait lire.
#      preuve: ecriture  -> on regarde la date d'ecriture de `ecrit`
#      preuve: run       -> on regarde le dernier run REUSSI (API Actions)
#    ⚠️ `preuve: run` est le maillon FAIBLE : `success()` dit « le run a-t-il
#       fini », pas « le travail a-t-il avance ». A remplacer a terme par un
#       battement de coeur ecrit a chaque tour, diff ou pas.
#
# ⭐⭐⭐ `depend_de` — L'AGE NE SUFFIT PAS, L'ORDRE COMPTE. `ledger-writer`
#    (jeu 22:00, scrapeur-veve) consomme `analytics` (mer 06:00, **jetonveve**).
#    `workflow_run` ne franchit pas la frontiere d'un depot : le jeudi il part
#    quand meme et ecrit du perime, avec un run VERT. Regle appliquee :
#    date(consommateur) > date(producteur).
#    ⏳ Correctif NON OBSERVABLE avant le 12/08 (cron mercredi) : « depose »
#       n'est pas « prouve ».
#
# ➡️ LA SENTINELLE ANNONCE CHAQUE JOUR COMBIEN D'ENTREES NE SONT PAS VALIDEES.
#    Un manifeste a moitie rempli qui ne le dit pas est pire qu'un vide.
# ⭐⭐ ET ELLE POSTE AUSSI QUAND TOUT VA BIEN : morte, elle est silencieuse,
#    ce qui est indistinguable de « tout va bien ».
#
# ⚠️ `ecrit: []` ne veut pas dire « n'ecrit rien » mais « le YAML ne le dit
#    pas » (l'ecriture se fait dans le code Python) — 4 entrees.
# ═══════════════════════════════════════════════════════════════════════════


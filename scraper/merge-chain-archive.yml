name: Fusion archive CollectChain (fichier propre, bout en bout)

# Un seul fichier propre genese -> maintenant : fusion des DEUX Releases
# d'archives (chain-archive du deep scan astronema + chain-archive-daily de ce
# repo), deduplique par (block, log_index) et trie. Tourne sur le runner GitHub
# (14-16 Go RAM), donc pas de limite locale. A relancer a la demande (ou apres
# un gros backfill) pour rafraichir le fichier de bout en bout.

on:
  workflow_dispatch:
    inputs:
      archive_repo:
        description: "Repo owner/name de la Release chain-archive (deep scan)"
        required: false
        default: "astronemagame-maker/astronema"

permissions:
  contents: write

concurrency:
  group: merge-chain-archive
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Historique (Release chain-archive — deep scan astronema, public)"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.inputs.archive_repo || 'astronemagame-maker/astronema' }}
        run: |
          mkdir -p arch
          gh release download chain-archive --repo "$REPO" --dir arch \
            --pattern 'transfers_*.csv.gz'

      - name: "Continuite (Release chain-archive-daily — ce repo)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download chain-archive-daily --dir arch \
            --pattern 'transfers_*.csv.gz' \
            || echo "Pas encore de chain-archive-daily — on fusionne le seul historique."
          echo "Fichiers a fusionner :" && ls -lh arch | tail -n +1 | head -40

      - name: "Fusion + dedup (block,log_index) + tri chronologique"
        run: python -m scraper.merge_archive arch transfers_full.csv.gz

      - name: "Publier la Release chain-archive-full"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view chain-archive-full >/dev/null 2>&1 || \
            gh release create chain-archive-full \
              --title "Transferts CollectChain — fichier propre, bout en bout" \
              --notes "UN seul CSV.gz genese->maintenant : fusion des Releases chain-archive (deep scan astronema) + chain-archive-daily (incrementaux), deduplique par (block,log_index) et trie. Colonnes: block,log_index,ts_utc,date_pt,kind,category,veve_uuid,edition,from,to. Regenerable a la demande via ce workflow."
          gh release upload chain-archive-full transfers_full.csv.gz --clobber
          echo "✅ Release chain-archive-full mise a jour."

name: VeVe transactions — BACKFILL

# REPRENABLE (leçon du run #1 : 730 pages / 52 min perdues sur un HTTP 500
# transitoire). Chaque run :
#   * garde TOUJOURS sa recolte (jamais d'echec qui jette tout) ;
#   * reduit la taille de page si l'API tousse (100 -> 50 -> 25 -> 10) ;
#   * ecrit data/veve_tx_state.json -> le run suivant REPREND ou il s'est
#     arrete (il saute les jours deja ecrits).
# Relancer autant de fois que necessaire jusqu'a « etat=TERMINE » dans le
# resume. Pour repartir de zero : supprimer data/veve_tx_state.json.

on:
  workflow_dispatch:
    inputs:
      until:
        description: "Remonter jusqu'a ce jour PT (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
      max_pages:
        description: "Pages par run (garde-fou)"
        required: false
        default: "3000"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Backfill du flux VeVe (reprenable)
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          VEVE_TX_BACKFILL: "true"
          VEVE_TX_UNTIL: ${{ github.event.inputs.until }}
          VEVE_TX_MAX_PAGES: ${{ github.event.inputs.max_pages }}
          VEVE_TX_PAUSE: "0.3"
        run: python -m scraper.veve_tx

      - name: Commit (donnees + etat de reprise)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/veve_tx_daily.csv data/veve_tx_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "veve_tx: backfill (reprise)"
          git push || true

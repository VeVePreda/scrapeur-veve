name: Analytics - grand livre (holdings)

# Telecharge l'archive des transferts (Release "chain-archive" du repo public
# astronema), reconstruit QUI DETIENT QUEL EXEMPLAIRE, puis ecrit :
#   - data/ledger.csv.gz  (grand livre complet, commite)
#   - onglet 📊A-WHALES         (top wallets)
#   - onglet 📊A-CONCENTRATION  (Gini / holders par collectible)
#
# /!\ EXACT seulement quand le scan CollectChain (astronema) est TERMINE.
# Avant : partiel (editions non tradees depuis le mur du scan manquent).

on:
  workflow_dispatch:
    inputs:
      archive_repo:
        description: "Repo owner/name de l'archive chain-archive"
        default: "astronemagame-maker/astronema"
      whales_top:
        description: "Nombre de whales a lister"
        default: "200"

permissions:
  contents: write

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      WHALES_TOP: ${{ github.event.inputs.whales_top || '200' }}
      ARCHIVE_DIR: dl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Telecharger l'archive (Release chain-archive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          REPO="${{ github.event.inputs.archive_repo || 'astronemagame-maker/astronema' }}"
          gh release download chain-archive --repo "$REPO" --dir dl --pattern '*.csv.gz' || {
            echo "Echec du telechargement de l'archive."; exit 1; }
          echo "Fichiers telecharges :" && ls -lh dl/

      - name: Construire le grand livre + agregats
        run: python -m scraper.ledger

      - name: Commit du grand livre
        if: ${{ always() }}
        run: |
          git config user.name "veve-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ledger.csv.gz data/wallet_profiles.csv.gz
          if git diff --cached --quiet; then echo "Rien a committer."; exit 0; fi
          git commit -m "ledger: grand livre + profils $(date -u +%FT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((i * 5))
          done

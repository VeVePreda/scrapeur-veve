name: IMX probe v2 (backend immutascan)

# La v1 a montre : api.x.immutable.com = morte (404), MAIS immutascan.io/api/
# repond (JSON gzippe). Cette v2 decompresse (--compressed) et sonde quelques
# variantes pour comprendre la structure. Ne touche a rien. Coller le log.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Backend immutascan (decompresse)
        run: |
          C=0xa7aefead2f25972d80516628417ac46b3f2604af
          for url in \
            "https://immutascan.io/api/address/$C" \
            "https://immutascan.io/api/address/$C?tab=0" \
            "https://immutascan.io/api/address/$C/transactions" \
            "https://immutascan.io/api/address/$C/transfers?page=1" \
            "https://immutascan.io/api/tx?address=$C&page=1" ; do
            echo "=== GET $url"
            curl -sS --compressed -m 25 -w "\n(HTTP %{http_code})\n" "$url" | head -c 2500 || echo "(echec curl)"
            echo; echo
          done

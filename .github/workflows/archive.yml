# ⚠️ DEPOT : VeVePreda/scrapeur-veve   ·   CHEMIN : .github/workflows/archive.yml
name: Archive des salons

# Sauve les messages (et leurs tweets fossilises dans les embeds) de PLUSIEURS
# salons Discord de la commu VeVe avant qu'ils ne s'effacent. Chaque salon a son
# propre fichier -> data/archive_<nom>.jsonl + data/archive_<nom>_state.json.
#
# LE CODE NE BOUGE PAS : scraper/archive_discord.py sait deja cibler n'importe
# quel salon via ARCHIVE_CHANNEL / ARCHIVE_JSONL / ARCHIVE_STATE / ARCHIVE_MEDIAS.
# Le multi-salon vit ICI, dans une simple boucle shell (nom:id). Ajouter un salon
# = une ligne dans SALONS.
#
# POURQUOI UN WORKFLOW A PART (Preda a raison de refuser 50 workflows) : ce n'est
# pas un PUBLIEUR mais un COLLECTEUR — il tourne longtemps, ecrit de gros fichiers
# et depose un artifact. Le mettre dans le hub Discord le rendrait fragile.
#
# ⚠️ PREALABLE (bug du 14/07) : le bot DOIT avoir le MESSAGE CONTENT INTENT
# (Developer Portal -> Bot -> Privileged Gateway Intents) ET, sur CHAQUE salon,
# les permissions « Voir le salon » + « Lire l'historique des messages ». Sans
# intent, Discord repond 200 avec des messages VIDES : la sonde salon_muet refuse
# alors d'ecrire (aucune corruption). Sans acces, c'est un 403 : le salon est
# saute et la boucle continue avec les suivants.

on:
  workflow_dispatch:
    inputs:
      salon:
        description: "Quel salon (nom) ou 'tous'"
        required: false
        default: "tous"
      modes:
        description: "Quoi faire"
        required: false
        default: "messages"
        type: choice
        options: ["messages", "images", "messages,images"]
      max_pages:
        description: "Nb max de pages de 100 messages (0 = tout)"
        required: false
        default: "0"
      max_medias:
        description: "Nb max de médias à télécharger (0 = tout)"
        required: false
        default: "0"
      purger:
        description: "JETER l'archive du/des salon(s) visé(s) et repartir de zéro (à faire UNE fois après avoir activé le Message Content Intent)"
        required: false
        default: "non"
        type: choice
        options: ["non", "oui"]
  # ⛔ CRON RETIRE LE 19/07/2026 — decision Preda : « je n'utilise plus
  # archive salon, c'etait juste pour prendre l'historique, j'en ai plus
  # besoin maintenant ».
  #
  # Le workflow RESTE, en manuel uniquement. On ne le supprime pas : le
  # corpus des 13 salons est la matiere premiere du futur chatbot, et le
  # jour ou il faudra le completer, mieux vaut un bouton a cliquer qu'un
  # outil a reecrire. Un collecteur qu'on ne peut plus relancer est un
  # collecteur perdu.
  #
  # Pour le relancer : onglet Actions -> « Archive des salons » -> Run
  # workflow. Pour le remettre en automatique : decommenter les deux
  # lignes ci-dessous.
  # schedule:
  #   - cron: "20 4 * * *"

permissions:
  contents: write

concurrency:
  group: veve-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests

      - name: Collecte (tous les salons, ou un seul)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ARCHIVE_MODES: ${{ github.event.inputs.modes || 'messages' }}
          ARCHIVE_MAX_PAGES: ${{ github.event.inputs.max_pages || '0' }}
          ARCHIVE_MAX_MEDIAS: ${{ github.event.inputs.max_medias || '0' }}
          ARCHIVE_PURGER: ${{ github.event.inputs.purger == 'oui' && '1' || '' }}
          SALON: ${{ github.event.inputs.salon || 'tous' }}
        run: |
          # ── LES SALONS À ARCHIVER (nom:id). Ajouter un salon = une ligne. ──
          SALONS="veille:1126838487073689662
          value-comics:1133415487368351754
          forum-stats:1161531388558856202
          mcfarlane:1126838164032589825
          bazar:1192712757120864307
          disney-pinnacle:1174320609610706974
          mcu-dcu:1126841893716770888
          crypto:1126841126125588611
          candy:1126840628517556274
          elmonx:1126837520282431628
          digitoys:1126840163088224267
          fanable:1352265099821449216
          web3:1126841463624450158
          concours:1153358341377110148"
          # migration douce : l'ancien etat unique de la veille garde son historique
          if [ -f data/archive_state.json ] && [ ! -f data/archive_veille_state.json ]; then
            cp data/archive_state.json data/archive_veille_state.json
          fi
          echo "$SALONS" | while IFS=: read -r nom id; do
            nom=$(echo "$nom" | tr -d '[:space:]')
            id=$(echo "$id" | tr -d '[:space:]')
            if [ -z "$nom" ] || [ -z "$id" ]; then continue; fi
            if [ "$SALON" != "tous" ] && [ "$SALON" != "$nom" ]; then continue; fi
            echo "═══════════════ $nom ($id) ═══════════════"
            ARCHIVE_CHANNEL="$id" \
            ARCHIVE_JSONL="data/archive_${nom}.jsonl" \
            ARCHIVE_STATE="data/archive_${nom}_state.json" \
            ARCHIVE_MEDIAS="archive_medias_${nom}" \
            python -m scraper.archive_discord \
              || echo "⚠️ $nom : échec / salon muet / pas d'accès — on continue."
          done

      # JSONL + états vont dans le repo (PRIVE) : c'est ce qui permet la reprise
      # et le rattrapage quotidien. Les MEDIAS n'y vont PAS (des centaines de Mo
      # dans git = repo qu'on ne clone plus). `always()` : la récolte est sacrée.
      - name: Commit des archives
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/archive_*.jsonl data/archive_*_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "archive: salons VeVe ($(date -u +%F))"
          # ⚠️ REBASER ET REESSAYER : un push rejete jetterait toute la recolte.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep 10
          done

      # La copie locale de Preda : il telecharge cet artifact et le garde.
      - name: Artifact (JSONL + médias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-salons-veve-${{ github.run_number }}
          path: |
            data/archive_*.jsonl
            data/archive_*_state.json
            archive_medias_*/
          retention-days: 90
          if-no-files-found: warn

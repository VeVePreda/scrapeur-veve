name: Rattrapage chain (journee PT complete)

# LE PROBLEME (constate le 13/07) : une journee PT se termine a 07:00 UTC
# (= 09:00 heure de Paris en ete). Le daily tourne a 02:15 UTC, soit 19:15 PT
# la veille : la journee PT en cours n'est PAS finie, donc chain_run ne peut
# ecrire que l'avant-veille. Le tableau quotidien de 📊 STATS accusait donc
# 2 jours de retard — et AUCUN horaire matinal ne peut y changer quoi que ce
# soit : c'est le fuseau, pas un bug.
#
# LA SORTIE : on garde le daily tot (burns, revenue, digest prets a 6h) et on
# RATTRAPE ici, a 07:30 UTC (09:30 Paris), une fois la journee PT close :
# chain_run ecrit la journee de la veille, puis STATS est reecrite.
# Cout : ~4 min/jour.

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Etapes (all, ou liste : chain,registre,stats)"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: veve-daily          # jamais en meme temps que le daily
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      STEPS: ${{ github.event.inputs.steps || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Etat le plus recent (anti-checkout perime)
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1) CollectChain (journee PT desormais complete)
        if: ${{ contains(env.STEPS, 'all') || contains(env.STEPS, 'chain') }}
        env:
          CHAIN_MODE: daily
        run: python -m scraper.chain_run

      - name: 1b) Continuite archive (Release chain-archive-daily)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'chain')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls archive/transfers_daily_*.csv.gz >/dev/null 2>&1 || { echo "Rien a uploader."; exit 0; }
          gh release view chain-archive-daily >/dev/null 2>&1 || \
            gh release create chain-archive-daily --title "Archive quotidienne transferts CollectChain" \
              --notes "1 CSV.gz par journee PT complete."
          gh release upload chain-archive-daily archive/transfers_daily_*.csv.gz --clobber
          echo "Uploade :" && ls -lh archive/

      - name: 2) Wallet registry
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'registre')) }}
        run: python -m scraper.wallet_registry

      - name: 3) Commit registre wallets (data/)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'registre')) }}
        run: |
          [ -f data/wallet_registry_daily.csv ] || { echo "Rien a committer."; exit 0; }
          git config user.name "veve-catchup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wallet_registry_daily.csv
          if git diff --cached --quiet; then echo "Rien a committer."; exit 0; fi
          git commit -m "registry: rattrapage chain"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((i * 5))
          done

      - name: 4) Page 📊 STATS (avec la journee rattrapee)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'stats')) }}
        run: python -m scraper.stats_page

name: CollectChain daily activity sync

on:
  schedule:
    # 04:40 UTC — right after the catalogue sync, once a day.
    - cron: "40 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: chain-tracker
  cancel-in-progress: false

jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Incremental chain sync + stats
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CHAIN_MODE: daily
        run: python -m scraper.chain_run

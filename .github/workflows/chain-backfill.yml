name: CollectChain backfill (manual)

# Run this ONCE (Actions tab -> Run workflow) to load the last ~31 days of
# on-chain transfers into the ChainActivity tab. Afterwards the daily job
# only fetches what's new. Re-run anytime to rebuild from scratch.
# Archive aussi les journees PT completes traitees dans la Release
# chain-archive-daily (continuite de l'archive du scan profond).

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of history to fetch"
        default: "31"
        required: true

permissions:
  contents: write

concurrency:
  group: chain-tracker
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Full chain backfill
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CHAIN_MODE: backfill
          CHAIN_BACKFILL_DAYS: ${{ github.event.inputs.days }}
        run: python -m scraper.chain_run

      - name: Continuite archive (Release chain-archive-daily)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls archive/transfers_daily_*.csv.gz >/dev/null 2>&1 || { echo "Pas d'archive quotidienne a uploader."; exit 0; }
          gh release view chain-archive-daily >/dev/null 2>&1 || \
            gh release create chain-archive-daily --title "Archive quotidienne transferts CollectChain" \
              --notes "1 CSV.gz par journee PT complete, produit par chain_run (daily + backfill). Colonnes: block,log_index,ts_utc,date_pt,kind,category,veve_uuid,edition,from,to. Prolonge la Release chain-archive du scan profond (repo astronema) ; chevauchements deduplique par (block,log_index) dans ledger."
          gh release upload chain-archive-daily archive/transfers_daily_*.csv.gz --clobber
          echo "Uploade :" && ls -lh archive/

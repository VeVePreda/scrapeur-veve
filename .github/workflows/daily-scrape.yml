name: VeVe daily catalogue sync

on:
  schedule:
    # 05:30 UTC every day. Adjust the cron if you prefer another time.
    - cron: "30 5 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

concurrency:
  group: veve-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper + sync sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: Catalogue
        run: python -m scraper.run

name: VeVe daily catalogue sync

on:
  schedule:
    # 04:11 UTC = 06:11 in France in summer (CEST), 05:11 in winter (CET).
    # A few minutes PAST the hour avoids GitHub's heavy on-the-hour scheduling load:
    # top-of-hour cron jobs are frequently delayed or skipped. GitHub cron is UTC-only.
    - cron: "11 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: veve-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Light daily sync (upcoming + recent, floor for all collectibles)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: Catalogue
          ENRICH_MODE: new
          WINDOW_DAYS: "8"
          REFRESH_DYNAMIC: "true"
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
        run: python -m scraper.run

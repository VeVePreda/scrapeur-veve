name: VeVe daily sync (catalogue + chain + pseudos)

# One daily job that runs every step in order:
#   1. catalogue  — cold catalogues + 🟤C-MARQUE
#   2. chain      — CollectChain activity + escrow deposits (feeds 🟣C-PSEUDOS)
#   3. ventes     — ventes StackR (prix reels -> Revenue Market)
#   4. dynamic    — daily edition-counter refresh (GraphQL) into 🟠H-PRIX
#   5. wallets    — enrich 🟣C-PSEUDOS with on-chain first_seen / last_active
#
# The fast-moving dynamic data (floor/listings) has its own 3-hourly workflow.
# 13/07 : les steps 'stackr' (cookie 401) et 'market' (session VeVe morte)
# sont SUPPRIMES — ils tapaient VeVe chaque nuit pour rien. Les pseudos
# arrivent desormais gratuitement par veve_tx (getVeveTransactions).

on:
  schedule:
    # 04:11 UTC ≈ 06:11 FR (summer). A few minutes past the hour dodges GitHub's
    # heavy on-the-hour scheduling.
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Etapes (all, ou liste : catalogue,chain,ventes,editions,registre,stats,comics)"
        required: false
        default: "all"
      enrich_mode:
        description: "Catalogue : new (rapide, fenetre recente) ou all (backfill COMPLET — peuple ATH/ATL sur TOUS les items)"
        required: false
        default: "new"
        type: choice
        options: ["new", "all"]


permissions:
  contents: write

concurrency:
  group: veve-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
      STEPS: ${{ github.event.inputs.steps || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Etat le plus recent (anti-checkout perime)
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🖼️ LE CATALOGUE ON-CHAIN, AVANT LE STEP 1 ET PAS APRES (03/08/2026).
      # `sheets._normalise` y lit la colonne `image` pour remplir les fiches qui
      # n'ont AUCUN visuel (11 264 comics le 03/08, soit 68 %).
      # ⛔ CE STEP NE DOIT JAMAIS FAIRE ECHOUER LE DAILY : `|| echo` avale
      # l'absence de release, et `couvertures_chaine` traite le fichier manquant
      # comme un NO-OP bruyant. Un catalogue sans couverture reste un catalogue.
      # ⚠️ C'est le MEME fichier que l'etape 8bis (bascule d'identite), mais
      # telecharge INCONDITIONNELLEMENT ici : la bascule est un choix de Preda,
      # remplir un trou d'image n'en est pas un.
      - name: "0bis) Catalogue chaine (pour les couvertures)"
        if: ${{ contains(env.STEPS, 'all') || contains(env.STEPS, 'catalogue') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download elements-v3 --pattern elements_v3.csv --dir data --clobber 2>/dev/null \
            || echo "catalogue chaine indisponible — les fiches sans visuel le resteront ce tour."
          if [ -f data/elements_v3.csv ]; then
            head -1 data/elements_v3.csv | grep -q ",image" \
              && echo "✅ colonne image presente." \
              || echo "⚠️ elements_v3.csv SANS colonne image : moisson d'avant le 03/08/2026, rejouer elements-v3-moisson."
          fi

      - name: 1) Catalogue (cold + Marques)
        if: ${{ contains(env.STEPS, 'all') || contains(env.STEPS, 'catalogue') }}
        env:
          ENRICH_MODE: ${{ github.event.inputs.enrich_mode || 'new' }}
          WINDOW_DAYS: "8"
          REFRESH_DYNAMIC: "true"
          ELEMENTS_V3: data/elements_v3.csv
          COUVERTURES_CHAINE: ${{ vars.COUVERTURES_CHAINE || '1' }}
        run: python -m scraper.run

      # 🗃️ Commit du cache d'enrichissement TOUT DE SUITE apres le step 1.
      # Le step 1 (sheets.sync_catalogue) ECRIT data/enrichissement.csv ; si on le
      # laissait non commite, il resterait "unstaged" quand les steps suivants
      # (registre, catalogue) font `git pull --rebase` -> "cannot pull with rebase:
      # You have unstaged changes" (vu le 23/07). On le commite donc ici, isole :
      # chaque fichier est commite dans le step qui le produit, l'arbre reste propre.
      - name: "1b) Commit du cache enrichissement (data/)"
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'catalogue')) }}
        run: |
          git config user.name "veve-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/enrichissement.csv ] && git add data/enrichissement.csv
          git diff --cached --quiet && { echo "Rien a committer."; exit 0; }
          git commit -m "cache: maj enrichissement (daily)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((i * 5))
          done

      - name: 2) CollectChain (activity + escrow deposits)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'chain')) }}
        env:
          CHAIN_MODE: daily
        run: python -m scraper.chain_run

      - name: 2b) Continuite archive (Release chain-archive-daily)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'chain')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls archive/transfers_daily_*.csv.gz >/dev/null 2>&1 || { echo "Pas d'archive quotidienne a uploader."; exit 0; }
          gh release view chain-archive-daily >/dev/null 2>&1 || \
            gh release create chain-archive-daily --title "Archive quotidienne transferts CollectChain" \
              --notes "1 CSV.gz par journee PT complete, produit par chain_run (daily + backfill). Colonnes: block,log_index,ts_utc,date_pt,kind,category,veve_uuid,edition,from,to. Prolonge la Release chain-archive du scan profond (repo astronema) ; chevauchements deduplique par (block,log_index) dans ledger."
          gh release upload chain-archive-daily archive/transfers_daily_*.csv.gz --clobber
          echo "Uploade :" && ls -lh archive/

      - name: 3c) Ventes StackR (prix reels -> Revenue Market)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'ventes')) }}
        env:
          STACKR_COOKIE: ${{ secrets.STACKR_COOKIE }}
        run: python -m scraper.stackr_sales

      - name: 4) Dynamic edition counters (daily GraphQL pass)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'editions')) }}
        env:
          DYNAMIC_WITH_EDITIONS: "false"
        run: python -m scraper.dynamic_run

      - name: 5) Wallet registry (enrich Pseudos with on-chain activity)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'registre')) }}
        run: python -m scraper.wallet_registry

      - name: 6) Commit registre wallets (data/)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'registre')) }}
        run: |
          git config user.name "veve-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/wallet_registry_daily.csv ] && git add data/wallet_registry_daily.csv
          [ -f data/stackr_sales.csv ] && git add data/stackr_sales.csv
          git diff --cached --quiet && { echo "Rien a committer."; exit 0; }
          if git diff --cached --quiet; then echo "Rien a committer."; exit 0; fi
          git commit -m "registry: maj quotidienne wallets"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((i * 5))
          done

      - name: 7) Page 📊 STATS (activite 7 jours + sante des sources)
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'stats')) }}
        run: python -m scraper.stats_page

      # 🌉 LE PONT VERS LES ALERTES (14/07)
      # Le tirage, la 1re edition publique, le nombre d'offres et la note de
      # classement n'existent QUE dans le Sheet. Les alertes tournent sur
      # jetonveve (repo public), qui n'a AUCUN acces au Sheet — et c'est tres
      # bien ainsi. On exporte donc un CSV minimal (comics ET collectibles), que
      # jetonveve lit en lecture seule avec PREDA_TOKEN.
      # 🌉 BASCULE (etape 5, 23/07) : l'export officiel data/elements.csv est
      # desormais fabrique par le BUILDER v2 (tracker + cache enrichissement),
      # plus par les onglets froids. Consequences : atl/ath viennent du tracker
      # (FIN du ×100 immortel), listings du jour meme, supply/first_public/note
      # inchanges (identite prouvee = 0 sur 3 rapports). L'ancien export reste
      # dans le repo : ROLLBACK = remettre `python -m scraper.export_elements`
      # (et retirer le bloc env ci-dessous).
      - name: "8) Export du catalogue (pont alertes) — BUILDER v2 (bascule)"
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'comics')) }}
        env:
          ELEMENTS_V2: data/elements.csv
        run: python -m scraper.export_elements_v2

      # 🔀 BASCULE v3 (REVERSIBLE, gated) — identite depuis la chaine.
      # INACTIVE tant que la variable de depot BASCULE_IDENTITE_CHAINE != '1'.
      # Elle POST-TRAITE data/elements.csv fabrique par l'etape 8 : remplace les
      # seules colonnes d'IDENTITE (name, category, rarity, edition_type, supply,
      # brand, licensor) par celles du catalogue on-chain, et laisse INTACT tout
      # l'off-chain frais du jour (first_public, listings, note, atl/ath, dates).
      # Garde-fous dans scraper/bascule_identite.py : v3 absent ou < 15 000 lignes
      # -> on ne touche a rien ; une valeur chaine vide n'efface jamais le tracker ;
      # retour 0 systematique (un garde-fou ne casse jamais le daily).
      # REVENIR : remettre la variable a 0 — le daily reconstruit elements.csv
      # depuis le tracker AVANT cette etape, donc zero residu le lendemain.
      - name: "8bis) Identite depuis la chaine (bascule v3)"
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'comics')) }}
        env:
          ELEMENTS_CSV: data/elements.csv
          ELEMENTS_V3: data/elements_v3.csv
          BASCULE_IDENTITE_CHAINE: ${{ vars.BASCULE_IDENTITE_CHAINE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${BASCULE_IDENTITE_CHAINE}" = "1" ]; then
            gh release download elements-v3 --pattern elements_v3.csv --dir data --clobber 2>/dev/null \
              || echo "catalogue chaine indisponible — identite tracker conservee."
          fi
          python -m scraper.bascule_identite

      - name: "9) Commit du CSV catalogue"
        if: ${{ always() && (contains(env.STEPS, 'all') || contains(env.STEPS, 'comics')) }}
        run: |
          git config user.name "veve-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/elements.csv ] && git add data/elements.csv
          git diff --cached --quiet && { echo "Rien a committer."; exit 0; }
          git commit -m "catalogue: export du pont (alertes)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep $((i * 5))
          done

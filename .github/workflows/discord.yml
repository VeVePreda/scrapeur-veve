name: Hub Discord

# UN SEUL workflow pour TOUT le Discord (demande de Preda : « il ne faut pas
# 50 workflows »). Les modules sont pilotes par DISCORD_MODULES :
#   stats -> les 4 messages du post « 📊 STATS » (reecrits, jamais empiles)
#   blog  -> les nouveaux articles dans le post « ✍️BLOG », avec ping du role
#   drops -> les drops a venir dans le post « 📦DROP » : une carte par serie,
#            un ping par vague, et 3 reactions (D / M / ❌) posees par le BOT
#            (un webhook ne sait pas reagir — c'est la seule raison du token)
#   retour -> 24 h apres un drop, le post « 🔍 RETOUR DROP » : ventes reelles
#            (mints on-chain), taux d'ecoulement, note de classement, et le
#            SONDAGE de la carte d'annonce relu par le bot et confronte aux faits
# Ajouter un module demain = une ligne dans scraper/discord_hub.py. Rien ici.
#
# ⚠️ REMPLACE `stats-discord.yml` — SUPPRIME l'ancien fichier, sinon les stats
# seraient publiees DEUX FOIS (deux workflows, deux etats, deux commits qui se
# marchent dessus).
#
# Il ne COLLECTE RIEN : il lit ce que le pipeline a deja ecrit dans le Sheet
# (page 📊 STATS et onglet 📝C-BLOG). Aucune requete vers VeVe ou StackR.
#
# DEUX PASSAGES, et c'est voulu — les messages de stats sont EDITES, pas
# empiles, donc un 2e passage ne coute rien :
#   * 03:45 UTC (05:45 Paris) : apres le daily (04:15) et le blog (04:00) —
#     tout est pret quand Preda se leve ;
#   * 07:45 UTC (09:45 Paris) : apres chain-catchup, quand la journee PT est
#     enfin CLOSE (elle ne se ferme qu'a 09:00 Paris) : le tableau gagne son
#     dernier jour. Le blog, lui, n'aura rien de neuf a dire (son etat le sait).

on:
  schedule:
    - cron: "45 3 * * *"
    - cron: "45 7 * * *"
  workflow_dispatch:
    inputs:
      modules:
        description: "Modules a lancer"
        required: false
        default: "stats,blog,drops,retour"
        type: choice
        options: ["stats,blog,drops,retour", "stats", "blog", "drops", "retour",
                  "drops,retour"]
      blocs:
        description: "Stats : quels messages (annees,mois,jours_court,jours)"
        required: false
        default: "annees,mois,jours_court,jours"
      rejouer_drops:
        description: "Drops : oublier les drops A VENIR deja memorises, pour les annoncer"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      rejouer_retour:
        description: "Retour : oublier les drops de la fenetre deja memorises, pour les debriefer"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      retour_max:
        description: "Retour : nb max de drops a debriefer d'un coup (defaut 25)"
        required: false
        default: "25"
      purger_retour:
        description: "Retour : marquer les drops en attente comme VUS, sans rien publier"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

# Deux runs du hub en meme temps reecriraient le meme etat : jamais.
concurrency:
  group: veve-discord-hub
  cancel-in-progress: false

jobs:
  discord:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Hub Discord
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Un seul webhook pour tout le forum : les posts d'un meme salon le
          # partagent, seul le thread_id change. Un module dans un AUTRE salon
          # aura son propre secret (DISCORD_BLOG_WEBHOOK, etc.).
          # ═══ GARDE-FOUS ANTI-BAN, valables pour TOUS les modules ═══
          # PLAFOND : nb TOTAL de messages par run (au-dela, on refuse et on le
          # dit). PAUSE : secondes entre deux envois. Une rafale est exactement
          # ce qui fait bannir un webhook.
          DISCORD_MAX_MESSAGES: ${{ vars.DISCORD_MAX_MESSAGES || '15' }}
          DISCORD_PAUSE_S: ${{ vars.DISCORD_PAUSE_S || '3' }}
          DISCORD_HUB_WEBHOOK: ${{ secrets.DISCORD_HUB_WEBHOOK }}
          DISCORD_STATS_WEBHOOK: ${{ secrets.DISCORD_STATS_WEBHOOK }}
          DISCORD_BLOG_WEBHOOK: ${{ secrets.DISCORD_BLOG_WEBHOOK }}
          DISCORD_MODULES: ${{ github.event.inputs.modules || 'stats,blog,drops,retour' }}
          # Le token du BOT ne sert QU'AUX REACTIONS. S'il manque, les cartes
          # partent quand meme — sans sondage, et le log le dit.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_STATS_BLOCS: ${{ github.event.inputs.blocs || 'annees,mois,jours_court,jours' }}
          DISCORD_STATS_THREAD: ${{ vars.DISCORD_STATS_THREAD || '1526491450538196992' }}
          DISCORD_BLOG_THREAD: ${{ vars.DISCORD_BLOG_THREAD || '1526535133040087070' }}
          DISCORD_BLOG_ROLE: ${{ vars.DISCORD_BLOG_ROLE || '1526535593071345685' }}
          DISCORD_DROPS_WEBHOOK: ${{ secrets.DISCORD_DROPS_WEBHOOK }}
          DISCORD_DROPS_THREAD: ${{ vars.DISCORD_DROPS_THREAD || '1526540247469391952' }}
          DISCORD_DROPS_ROLE: ${{ vars.DISCORD_DROPS_ROLE || '1104653344108191818' }}
          DISCORD_DROPS_REJOUER: ${{ github.event.inputs.rejouer_drops || 'false' }}
          # L'illustration du message groupe « VeVe Comic Book Day ». Discord ne
          # sert pas de fichiers : depose la banniere dans un salon, copie son
          # lien, et pose-le ici (variable de repo). Sans elle : pas d'image.
          DISCORD_DROPS_IMAGE_COMIC_DAY: ${{ vars.DISCORD_DROPS_IMAGE_COMIC_DAY || '' }}
          DISCORD_RETOUR_WEBHOOK: ${{ secrets.DISCORD_RETOUR_WEBHOOK }}
          DISCORD_RETOUR_THREAD: ${{ vars.DISCORD_RETOUR_THREAD || '1526557575875924119' }}
          # Vide = le retour ne ping personne (choix par defaut : c'est une
          # analyse, pas une alerte). Mets un id de role ici pour l'activer.
          DISCORD_RETOUR_ROLE: ${{ vars.DISCORD_RETOUR_ROLE || '' }}
          DISCORD_RETOUR_REJOUER: ${{ github.event.inputs.rejouer_retour || 'false' }}
          DISCORD_RETOUR_MAX_NEUFS: ${{ github.event.inputs.retour_max || '25' }}
          DISCORD_RETOUR_PURGER: ${{ github.event.inputs.purger_retour || 'false' }}
          # ⚠️ Une URL de piece jointe Discord est SIGNEE et EXPIRE (ex/is/hm) :
          # au bout de quelques heures l'image ne s'affiche plus. Pour du
          # durable, heberger l'image sur le repo PUBLIC (raw.githubusercontent)
          # et poser l'URL ici.
          DISCORD_RETOUR_IMAGE_COMIC_DAY: ${{ vars.DISCORD_RETOUR_IMAGE_COMIC_DAY || '' }}
          DISCORD_RETOUR_IMAGE_FAIBLES: ${{ vars.DISCORD_RETOUR_IMAGE_FAIBLES || '' }}
        run: python -m scraper.discord_hub

      # L'etat porte les ids des messages (stats) et les slugs deja annonces
      # (blog). Sans lui : on ne peut plus EDITER, et le blog re-annoncerait —
      # avec un ping — des articles deja publies.
      - name: Commit des etats
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/discord_stats_state.json data/discord_blog_state.json data/discord_drops_state.json data/discord_retour_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "discord: etats (ids des messages, slugs annonces)"
          # ⚠️ REBASER + REESSAYER : un `git push || true` seul PERDAIT l'etat quand
          # un autre workflow (daily, etc.) avait pousse entre les 2 crons -> le run
          # suivant ne voyait pas les ids du comic day et le REPUBLIAIT (7h59 ET
          # 11h35). L'etat est sacre, comme pour les collecteurs longs.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done

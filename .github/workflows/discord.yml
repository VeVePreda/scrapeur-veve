name: Hub Discord

# UN SEUL workflow pour TOUT le Discord (demande de Preda : « il ne faut pas
# 50 workflows »). Les modules sont pilotes par DISCORD_MODULES :
#   stats -> les 4 messages du post « 📊 STATS » (reecrits, jamais empiles)
#   blog  -> les nouveaux articles dans le post « ✍️BLOG », avec ping du role
#   drops -> les drops a venir dans le post « 📦DROP » : une carte par serie,
#            un ping par vague, et 3 reactions (D / M / ❌) posees par le BOT
#            (un webhook ne sait pas reagir — c'est la seule raison du token).
#            La MEME carte part aussi, SANS ping, dans « 📘⎮sondage-drop »
#            (public) : deux salons, deux populations de votants.
#   retour -> 24 h apres un drop, le post « 🔍 RETOUR DROP » : ventes reelles
#            (mints on-chain), taux d'ecoulement, note de classement, et le
#            SONDAGE relu par le bot DANS LES DEUX SALONS et confronte aux
#            faits — deux lignes, et une personne ne compte jamais deux fois
#   calendrier -> le PNG du calendrier des drops, TELEVERSE chaque SAMEDI dans
#            le salon de CHAQUE marque (VeVe France, VeVe Insights), avec son
#            propre webhook et sa propre langue. Le module se garde lui-meme au
#            samedi et retient la semaine ISO publiee.
#            ⚠️ Seul module qui a besoin de cairo (SVG -> PNG) : d'ou l'etape
#            `apt-get install libcairo2` ci-dessous. Sans elle, l'import de
#            cairosvg echoue EN PLEIN RUN, pas au pip.
#   annonce -> l'annonce de debut de mois de VeVe France, le 2 (rattrapage le
#            3), dans le salon « Annonces ». 🚨 SEUL MODULE QUI PEUT PINGER
#            @everyone : l'interrupteur `DISCORD_ANNONCE_EVERYONE` est FERME
#            par defaut, et le module refuse de publier si la selection est
#            vide, le Sheet illisible ou la fenetre de ventes trouee.
#            ⛔ PAS DE CRON DEDIE, ET C'EST VOULU. Un « 45 7 2 * * » ne
#            tournerait qu'une fois par mois — or GitHub ABANDONNE des runs
#            planifies quand il est charge : un abandon = un mois saute, sans
#            rattrapage possible. Le cron quotidien ci-dessous repasse le 3,
#            et la cle « YYYY-MM » du module interdit le doublon.
# Ajouter un module demain = une ligne dans scraper/discord_hub.py. Rien ici.
#
# ⚠️ REMPLACE `stats-discord.yml` — SUPPRIME l'ancien fichier, sinon les stats
# seraient publiees DEUX FOIS (deux workflows, deux etats, deux commits qui se
# marchent dessus).
#
# Il ne COLLECTE RIEN : il lit ce que le pipeline a deja ecrit dans le Sheet
# (page 📊 STATS et onglet 📝C-BLOG). Aucune requete vers VeVe ou StackR.
#
# UN SEUL PASSAGE (decision Preda 24/07) : 07:45 UTC (09:45 Paris), apres
# chain-catchup, quand la journee PT est enfin CLOSE (elle ne se ferme qu'a
# 09:00 Paris) -> le tableau STATS gagne son dernier jour, et les drops/blog
# sont annonces une seule fois.
#   * L'ancien passage du matin (03:45 UTC ~ 8h Paris) est RETIRE : il faisait
#     une 2e publication par jour, or les stats sont editees (2e passage inutile)
#     et surtout un push concurrent entre les 2 crons pouvait faire perdre l'etat
#     des drops -> RE-ANNONCE du meme drop (vecu le 24/07 : 8h13 + 12h). Un seul
#     run/jour supprime cette classe de doublon.

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:
    inputs:
      modules:
        description: "Modules a lancer"
        required: false
        default: "stats,blog,drops,retour,feed,veille,calendrier,annonce"
        type: choice
        options: ["stats,blog,drops,retour,feed,veille,calendrier,annonce",
                  "stats", "blog", "drops", "retour", "feed", "veille",
                  "calendrier", "annonce", "drops,retour"]
      blocs:
        description: "Stats : quels messages (annees,mois,jours_court,jours)"
        required: false
        default: "annees,mois,jours_court,jours"
      rejouer_drops:
        description: "Drops : oublier les drops A VENIR deja memorises, pour les annoncer"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      rejouer_retour:
        description: "Retour : oublier les drops de la fenetre deja memorises, pour les debriefer"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      retour_max:
        description: "Retour : nb max de drops a debriefer d'un coup (defaut 25)"
        required: false
        default: "25"
      purger_retour:
        description: "Retour : marquer les drops en attente comme VUS, sans rien publier"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      forcer_calendrier:
        description: "Calendrier : publier meme si on n'est pas samedi (et rejouer la semaine)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      forcer_annonce:
        description: "Annonce : publier meme si on n'est pas le 2 (et rejouer le mois)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      annonce_everyone:
        description: "Annonce : autoriser le ping @everyone sur CE run (defaut : la variable du depot)"
        required: false
        default: ""
        type: choice
        options: ["", "false", "true"]

permissions:
  contents: write

# Deux runs du hub en meme temps reecriraient le meme etat : jamais.
concurrency:
  group: veve-discord-hub
  cancel-in-progress: false

jobs:
  discord:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ⚠️ cairosvg s'installe tres bien par pip SANS que cairo soit present :
      # l'echec n'arrive qu'a l'IMPORT, donc en plein run, et seulement le jour
      # ou le module calendrier tourne (le samedi). On installe la lib systeme
      # ici, une fois pour toutes — 2 s, et un mode de panne en moins.
      - name: Bibliotheques cairo (module calendrier)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2

      - run: pip install -r requirements.txt

      - name: Hub Discord
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Un seul webhook pour tout le forum : les posts d'un meme salon le
          # partagent, seul le thread_id change. Un module dans un AUTRE salon
          # aura son propre secret (DISCORD_BLOG_WEBHOOK, etc.).
          # ═══ GARDE-FOUS ANTI-BAN, valables pour TOUS les modules ═══
          # PLAFOND : nb TOTAL de messages par run (au-dela, on refuse et on le
          # dit). PAUSE : secondes entre deux envois. Une rafale est exactement
          # ce qui fait bannir un webhook.
          # ⚠️ MONTE A 25 LE 28/07 : chaque carte de drop part DEUX fois (📦DROP
          # + le miroir public 📘sondage-drop). Le plafond de 15 aurait coupe la
          # publication en plein milieu — et le message coupe serait justement
          # le miroir, donc un sondage public a moitie ouvert.
          DISCORD_MAX_MESSAGES: ${{ vars.DISCORD_MAX_MESSAGES || '25' }}
          DISCORD_PAUSE_S: ${{ vars.DISCORD_PAUSE_S || '3' }}
          DISCORD_HUB_WEBHOOK: ${{ secrets.DISCORD_HUB_WEBHOOK }}
          DISCORD_STATS_WEBHOOK: ${{ secrets.DISCORD_STATS_WEBHOOK }}
          DISCORD_BLOG_WEBHOOK: ${{ secrets.DISCORD_BLOG_WEBHOOK }}
          # 🔴🔴 LE REPLI DU CRON DOIT LISTER LES MEMES MODULES QUE LE CHOIX
          # MANUEL (corrige le 03/08/2026). `github.event.inputs.modules` est
          # VIDE sur un declenchement planifie : c'est donc la chaine ci-dessous
          # — et ELLE SEULE — qui pilote les passages automatiques. Elle avait
          # ete oubliee quand `calendrier` a ete ajoute : le module figurait
          # dans la liste deroulante du lancement manuel, mais le cron du samedi
          # ne l'appelait JAMAIS. Aucune erreur, aucun log : un module complet,
          # depose et fonctionnel, qui ne s'est simplement jamais execute.
          # ⭐ Un defaut par repli ne se voit que le jour ou on lit le repli.
          # ➡️ AJOUTER UN MODULE = LE METTRE AUX DEUX ENDROITS (ici + `options`
          #    de workflow_dispatch, plus haut).
          DISCORD_MODULES: ${{ github.event.inputs.modules || 'stats,blog,drops,retour,feed,veille,calendrier,annonce' }}
          # Rattrapage du miroir public : nb max de cartes retentees par
          # passage, et nb d'essais avant abandon bruyant.
          DISCORD_DROPS_MIROIR_RATTRAPAGE: ${{ vars.DISCORD_DROPS_MIROIR_RATTRAPAGE || '5' }}
          DISCORD_DROPS_MIROIR_ESSAIS: ${{ vars.DISCORD_DROPS_MIROIR_ESSAIS || '3' }}
          # Le token du BOT ne sert QU'AUX REACTIONS. S'il manque, les cartes
          # partent quand meme — sans sondage, et le log le dit.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_STATS_BLOCS: ${{ github.event.inputs.blocs || 'annees,mois,jours_court,jours' }}
          DISCORD_STATS_THREAD: ${{ vars.DISCORD_STATS_THREAD || '1526491450538196992' }}
          DISCORD_BLOG_THREAD: ${{ vars.DISCORD_BLOG_THREAD || '1526535133040087070' }}
          DISCORD_BLOG_ROLE: ${{ vars.DISCORD_BLOG_ROLE || '1526535593071345685' }}
          DISCORD_DROPS_WEBHOOK: ${{ secrets.DISCORD_DROPS_WEBHOOK }}
          DISCORD_DROPS_THREAD: ${{ vars.DISCORD_DROPS_THREAD || '1526540247469391952' }}
          DISCORD_DROPS_ROLE: ${{ vars.DISCORD_DROPS_ROLE || '1104653344108191818' }}
          DISCORD_DROPS_REJOUER: ${{ github.event.inputs.rejouer_drops || 'false' }}
          # L'illustration du message groupe « VeVe Comic Book Day ». Discord ne
          # sert pas de fichiers : depose la banniere dans un salon, copie son
          # lien, et pose-le ici (variable de repo). Sans elle : pas d'image.
          DISCORD_DROPS_IMAGE_COMIC_DAY: ${{ vars.DISCORD_DROPS_IMAGE_COMIC_DAY || '' }}
          # ═══ 📘⎮sondage-drop — LE MIROIR PUBLIC DES CARTES DE DROP ═══
          # 📦DROP est cote INVESTISSEUR ; ce salon-ci est PUBLIC. La meme carte
          # y part, SANS ping, avec ses 3 reactions — et `retour` en tire une
          # 2e ligne de sondage, dedoublonnee de ceux qui ont vote en prive.
          # SALON NORMAL (pas un post de forum) : DISCORD_SONDAGE_THREAD vide.
          # ⚠️ Sans le secret, le miroir est MUET (il ne retombe jamais sur le
          # webhook du hub — ce serait deverser les cartes dans le mauvais salon).
          # ⚠️ Le BOT doit etre dans ce salon avec « Voir le salon », « Lire
          # l'historique » et « Ajouter des reactions » : sans lui, pas de
          # boutons de vote, donc pas de sondage public.
          DISCORD_SONDAGE_WEBHOOK: ${{ secrets.DISCORD_SONDAGE_WEBHOOK }}
          DISCORD_SONDAGE_SALON: ${{ vars.DISCORD_SONDAGE_SALON || '1531670469319852082' }}
          DISCORD_SONDAGE_THREAD: ${{ vars.DISCORD_SONDAGE_THREAD || '' }}
          DISCORD_RETOUR_WEBHOOK: ${{ secrets.DISCORD_RETOUR_WEBHOOK }}
          DISCORD_RETOUR_THREAD: ${{ vars.DISCORD_RETOUR_THREAD || '1526557575875924119' }}
          # Vide = le retour ne ping personne (choix par defaut : c'est une
          # analyse, pas une alerte). Mets un id de role ici pour l'activer.
          DISCORD_RETOUR_ROLE: ${{ vars.DISCORD_RETOUR_ROLE || '' }}
          DISCORD_RETOUR_REJOUER: ${{ github.event.inputs.rejouer_retour || 'false' }}
          DISCORD_RETOUR_MAX_NEUFS: ${{ github.event.inputs.retour_max || '25' }}
          DISCORD_RETOUR_PURGER: ${{ github.event.inputs.purger_retour || 'false' }}
          # ⚠️ Une URL de piece jointe Discord est SIGNEE et EXPIRE (ex/is/hm) :
          # au bout de quelques heures l'image ne s'affiche plus. Pour du
          # durable, heberger l'image sur le repo PUBLIC (raw.githubusercontent)
          # et poser l'URL ici.
          DISCORD_RETOUR_IMAGE_COMIC_DAY: ${{ vars.DISCORD_RETOUR_IMAGE_COMIC_DAY || '' }}
          DISCORD_RETOUR_IMAGE_FAIBLES: ${{ vars.DISCORD_RETOUR_IMAGE_FAIBLES || '' }}
          # ═══ FEED INVESTOR — le comparatif hebdo (dimanche) ═══
          # SALON NORMAL (pas un post de forum) : DISCORD_FEED_THREAD reste VIDE.
          # Son propre webhook (secret). Le module se garde LUI-MEME au dimanche
          # (le hub passe tous les jours) et ne publie qu'une fois par semaine.
          DISCORD_FEED_WEBHOOK: ${{ secrets.DISCORD_FEED_WEBHOOK }}
          DISCORD_FEED_THREAD: ${{ vars.DISCORD_FEED_THREAD || '' }}
          # Le lien « Détails » du message -> le post « 📊 STATS ».
          DISCORD_FEED_DETAILS_URL: ${{ vars.DISCORD_FEED_DETAILS_URL || 'https://discord.com/channels/310073753709182977/1526491450538196992' }}
          # 6 = dimanche (lun=0 … dim=6). Vide de role = ne ping personne.
          DISCORD_FEED_JOUR: ${{ vars.DISCORD_FEED_JOUR || '6' }}
          DISCORD_FEED_ROLE: ${{ vars.DISCORD_FEED_ROLE || '' }}
          # ═══ VEILLE — les blogs partenaires (ElmonX, Candy) dans leur forum ═══
          # POSTS DE FORUM : chaque source a son thread_id (défauts posés dans le
          # module). Si les 2 posts sont dans le MÊME forum, un seul webhook
          # (DISCORD_VEILLE_WEBHOOK) suffit ; sinon un par source. Aucun ping par
          # défaut (les DISCORD_*_ROLE restent vides).
          DISCORD_VEILLE_WEBHOOK: ${{ secrets.DISCORD_VEILLE_WEBHOOK }}
          DISCORD_ELMONX_WEBHOOK: ${{ secrets.DISCORD_ELMONX_WEBHOOK }}
          DISCORD_ELMONX_THREAD: ${{ vars.DISCORD_ELMONX_THREAD || '1526847750749028352' }}
          DISCORD_ELMONX_ROLE: ${{ vars.DISCORD_ELMONX_ROLE || '' }}
          DISCORD_CANDY_WEBHOOK: ${{ secrets.DISCORD_CANDY_WEBHOOK }}
          DISCORD_CANDY_THREAD: ${{ vars.DISCORD_CANDY_THREAD || '1526846817931755652' }}
          DISCORD_CANDY_ROLE: ${{ vars.DISCORD_CANDY_ROLE || '' }}
          # ═══ CALENDRIER — le PNG des drops, chaque SAMEDI, une marque = un salon ═══
          # UN WEBHOOK PAR MARQUE : les deux marques sont dans DEUX serveurs
          # differents. Tant qu'un secret est vide, la marque tourne en
          # SIMULATION (l'image est fabriquee, rien n'est poste, l'etat n'est
          # PAS ecrit) — de quoi verifier le rendu avant d'ouvrir le robinet.
          DISCORD_CALENDRIER_WEBHOOK_VEVEFRANCE: ${{ secrets.DISCORD_CALENDRIER_WEBHOOK_VEVEFRANCE }}
          DISCORD_CALENDRIER_WEBHOOK_VEVEINSIGHTS: ${{ secrets.DISCORD_CALENDRIER_WEBHOOK_VEVEINSIGHTS }}
          # THREAD : à remplir SEULEMENT si le salon est un POST DE FORUM.
          # Un salon normal se poste SANS thread_id (laisser vide).
          DISCORD_CALENDRIER_THREAD_VEVEFRANCE: ${{ vars.DISCORD_CALENDRIER_THREAD_VEVEFRANCE || '' }}
          DISCORD_CALENDRIER_THREAD_VEVEINSIGHTS: ${{ vars.DISCORD_CALENDRIER_THREAD_VEVEINSIGHTS || '' }}
          # Vide = ne ping personne. Un id de role ici pour annoncer la sortie.
          DISCORD_CALENDRIER_ROLE_VEVEFRANCE: ${{ vars.DISCORD_CALENDRIER_ROLE_VEVEFRANCE || '' }}
          DISCORD_CALENDRIER_ROLE_VEVEINSIGHTS: ${{ vars.DISCORD_CALENDRIER_ROLE_VEVEINSIGHTS || '' }}
          # 5 = samedi (lun=0 … dim=6). Le hub passe tous les jours : c'est le
          # module qui se garde lui-meme, comme le feed du dimanche.
          DISCORD_CALENDRIER_JOUR: ${{ vars.DISCORD_CALENDRIER_JOUR || '5' }}
          DISCORD_CALENDRIER_SEMAINES: ${{ vars.DISCORD_CALENDRIER_SEMAINES || '5' }}
          DISCORD_CALENDRIER_MARQUES: ${{ vars.DISCORD_CALENDRIER_MARQUES || 'vevefrance,veveinsights' }}
          DISCORD_CALENDRIER_FORCE: ${{ github.event.inputs.forcer_calendrier || 'false' }}
          # ═══ 📢 ANNONCE — le 2 du mois, salon « Annonces » de VeVe France ═══
          # SALON NORMAL (pas un post de forum) : DISCORD_ANNONCE_THREAD vide.
          # 🔴 LE SECRET NE RETOMBE SUR RIEN. Le module lit
          # DISCORD_ANNONCE_WEBHOOK EN DIRECT (pas `api.webhook()`, qui se
          # rabat sur DISCORD_HUB_WEBHOOK) : secret absent = SIMULATION dans
          # les logs, jamais un @everyone dans le forum du hub.
          DISCORD_ANNONCE_WEBHOOK: ${{ secrets.DISCORD_ANNONCE_WEBHOOK }}
          DISCORD_ANNONCE_THREAD: ${{ vars.DISCORD_ANNONCE_THREAD || '' }}
          # 🚨 L'INTERRUPTEUR D'ARRET DU @everyone — FERME par defaut.
          # Le module publie quand meme (texte identique), il ne SONNE pas.
          # Pour ouvrir : variable de depot DISCORD_ANNONCE_EVERYONE = true
          # (ou l'input `annonce_everyone` pour un seul run manuel).
          DISCORD_ANNONCE_EVERYONE: ${{ github.event.inputs.annonce_everyone || vars.DISCORD_ANNONCE_EVERYONE || 'false' }}
          # Le 2, et le 3 en rattrapage (les crons GitHub arrivent avec 2 a 3 h
          # de retard, et GitHub abandonne des runs quand il est charge).
          DISCORD_ANNONCE_JOUR: ${{ vars.DISCORD_ANNONCE_JOUR || '2' }}
          DISCORD_ANNONCE_TOLERANCE: ${{ vars.DISCORD_ANNONCE_TOLERANCE || '1' }}
          # Nb de series citees · part de ventes minimale pour NOMMER un theme
          # (« un mois Star Wars ») · nb minimal de journees de ChainItems.
          # ⚠️ ChainItems ne garde que 35 jours : sous ce seuil, le classement
          # « le plus vendu » serait fausse par une fenetre trouee -> rien.
          DISCORD_ANNONCE_MAX: ${{ vars.DISCORD_ANNONCE_MAX || '6' }}
          DISCORD_ANNONCE_SEUIL_THEME: ${{ vars.DISCORD_ANNONCE_SEUIL_THEME || '0.40' }}
          DISCORD_ANNONCE_COUVERTURE: ${{ vars.DISCORD_ANNONCE_COUVERTURE || '20' }}
          # v1 : aucune illustration. Le crochet est perce (fichier
          # data/annonce_crochets.json ou cette variable) pour que le futur
          # projet de generation n'ait qu'a le remplir.
          # ⚠️ Pas d'URL de piece jointe Discord : elles EXPIRENT.
          DISCORD_ANNONCE_IMAGE: ${{ vars.DISCORD_ANNONCE_IMAGE || '' }}
          DISCORD_ANNONCE_FORCE: ${{ github.event.inputs.forcer_annonce || 'false' }}
        run: python -m scraper.discord_hub

      # L'etat porte les ids des messages (stats) et les slugs deja annonces
      # (blog). Sans lui : on ne peut plus EDITER, et le blog re-annoncerait —
      # avec un ping — des articles deja publies.
      - name: Commit des etats
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 🔴🔴 NE JAMAIS LISTER LES ETATS DANS UN SEUL `git add`
          # (paye du 28/07 au 03/08/2026 : 6 jours de re-publications).
          # `git add a b absent` N'AJOUTE RIEN DU TOUT — git valide TOUTES les
          # pathspecs d'abord, une seule qui ne matche pas et il abandonne le
          # lot entier. Or `discord_calendrier_state.json` N'EXISTE PAS tant
          # que le calendrier tourne en simulation (secrets vides). Resultat :
          # `git add` sortait en `fatal:`, avale par `2>/dev/null || true`,
          # `git diff --cached --quiet` etait VRAI, aucun commit, aucune erreur,
          # etape VERTE — et le lendemain drops / retour / blog reannoncaient
          # tout, parce que l'etat lu au checkout etait reste celui du 28/07.
          # ⭐ Un fichier A LA FOIS, chacun garde par `-f` : un etat absent
          # ne peut plus emporter les six autres. Le glob prend aussi tout
          # module futur (`data/discord_<module>_state.json`) sans y revenir.
          etats=0
          for f in data/discord_*_state.json; do
            [ -f "$f" ] || continue
            git add "$f"
            etats=$((etats + 1))
          done
          echo "[etats] $etats fichier(s) d'etat suivis"
          if [ "$etats" -eq 0 ]; then
            echo "::error::Aucun data/discord_*_state.json — rien a memoriser, la prochaine execution REPUBLIERA tout."
            exit 1
          fi
          git diff --cached --quiet && echo "[etats] rien de neuf a commiter" || git commit -m "discord: etats (ids des messages, slugs annonces)"
          # ⚠️ REBASER + REESSAYER : un `git push || true` seul PERDAIT l'etat quand
          # un autre workflow (daily, etc.) avait pousse entre les 2 crons -> le run
          # suivant ne voyait pas les ids du comic day et le REPUBLIAIT (7h59 ET
          # 11h35). L'etat est sacre, comme pour les collecteurs longs.
          # ⛔ La boucle seule est MUETTE en cas d'echec total : `for` rend le
          # code du dernier `sleep` (0), donc 5 push rates finissaient VERTS et
          # l'etat etait perdu en silence. Un push d'etat rate DOIT etre rouge.
          pousse=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              pousse=1
              break
            fi
            sleep $((i * 5))
          done
          if [ "$pousse" -ne 1 ]; then
            echo "::error::L'etat n'a PAS ete pousse apres 5 essais — la prochaine execution REPUBLIERA."
            exit 1
          fi

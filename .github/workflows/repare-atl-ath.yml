# ⚠️ DEPOT : VeVePreda/scrapeur-veve   ·   CHEMIN : .github/workflows/repare-atl-ath.yml
# Le projet vit sur 6 depots et DEUX comptes GitHub. Un fichier
# depose au mauvais endroit ne provoque aucune erreur : il dort.

name: Reparation des colonnes chiffrees (a la main)

# 🔧 REPARATION PONCTUELLE. Le coupable est nomme depuis le 03/08/2026 :
# `gspread.utils.numericise` traite la virgule comme un separateur de MILLIERS
# (« 9,99 » -> 999). Le robinet est ferme par le lot 50 (lecture UNFORMATTED) ;
# ce workflow repare le dommage DEJA GELE en re-demandant la verite au tracker.
#
# ⭐ CE N'EST PAS UN BUG « ATL », C'EST UN BUG « NOMBRE A DECIMALES ».
#   03/08 (fait)   : atl / ath      -> 3 214 paires impossibles ramenees a 0.
#   lot 51 (ici)   : store_price_gems (comics) + gemsPerMcp (les 2 onglets).
#
# MODE D'EMPLOI :
#   1. Lancer avec simuler = oui (defaut) et colonnes = prix. Lire le rapport :
#      « store_price_gems >= 100 : N avant -> ~0 apres », le temoin
#      `daily_mcp_points` immobile, et la ligne « MESUREE SEULEMENT » des
#      collectibles.
#   2. Si le rapport est sain, relancer avec simuler = non.
#   3. Verifier ensuite catalogue-export (« 0 paire incoherente »), puis le
#      compteur « 🩺 extremes lus dans le Sheet » du daily.
#      ⭐ Le 0 du LENDEMAIN ne prouve rien : c'est le SURLENDEMAIN qui compte.
#
# ⛔ NE PAS LANCER EN MEME TEMPS QUE `daily` OU UNE MOISSON : le quota Sheets
#    est PAR MINUTE et PARTAGE par tous les workflows du projet. Le
#    `concurrency` ci-dessous ne protege que de soi-meme, pas des voisins.

on:
  workflow_dispatch:
    inputs:
      simuler:
        description: "Tourner a blanc : tout calculer, RIEN ecrire (lire le rapport d'abord)"
        required: false
        default: "oui"
        type: choice
        options: ["oui", "non"]
      colonnes:
        description: "Portee — 'prix' evite de rescraper pour reecrire des extremes deja reparees"
        required: false
        default: "prix"
        type: choice
        options: ["prix", "extremes", "tout"]
      collectibles_prix:
        description: "⛔ Ecrire store_price_gems sur 🔵C-COLLECTIBLE (desarme : leurs prix sont des ENTIERS de gems, donc indemnes de la virgule, et l'echelle du tracker n'y est pas prouvee)"
        required: false
        default: "non"
        type: choice
        options: ["non", "oui"]

permissions:
  contents: read

concurrency:
  group: repare-atl-ath
  cancel-in-progress: false

jobs:
  repare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reparation des colonnes chiffrees du catalogue froid
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPARE_SIMULER: ${{ github.event.inputs.simuler == 'non' && '0' || '1' }}
          REPARE_COLONNES: ${{ github.event.inputs.colonnes || 'prix' }}
          REPARE_COLLECT_PRIX: ${{ github.event.inputs.collectibles_prix == 'oui' && '1' || '0' }}
        run: python -m scraper.repare_atl_ath

name: VeVe brand logos sync

# Dedicated per-type script: brand logos (brand.landscapeImage) into the hidden
# _BrandImages tab; the daily catalogue run merges them into "🟤C-MARQUE".
# Only brands without a logo yet are fetched, so this is near-free after the first
# run. Licensor logos need a separate (licence-page) query — not fetched here yet.

on:
  schedule:
    - cron: "51 5 * * *"   # 05:51 UTC, just after floors.yml (05:41)
  workflow_dispatch:
    inputs:
      max:
        description: "Cap the number of collectibles scanned (0 = all)"
        required: false
        default: "0"

concurrency:
  group: veve-logos
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync brand logos -> _BrandImages
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          LOGOS_MAX: ${{ github.event.inputs.max || '0' }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
        run: python -m scraper.logos

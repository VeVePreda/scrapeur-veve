# ⚠️ DEPOT : VeVePreda/scrapeur-veve   ·   CHEMIN : .github/workflows/elements-v2-silence.yml
# Le projet vit sur 6 depots et DEUX comptes GitHub. Un fichier
# depose au mauvais endroit ne provoque aucune erreur : il dort.

name: Pont elements v2 (double en silence)

# 🌉 CHANTIER « le Sheet = interface, l'entrepot = magasin » (22/07/2026).
# Fabrique data/elements_v2.csv depuis le TRACKER et le compare au pont v1
# (onglets froids) SANS RIEN DEBRANCHER : la prod (jetonveve 🎯/📚) continue
# de lire la v1. Rien n'est commite : tout se lit dans le log du run.
#
# 🌉 BASCULE FAITE (etape 5, 23/07) : l'export officiel (daily step 8) est
# desormais le builder v2. Ce workflow n'a donc PLUS de cron — sinon il
# refaisait un 2e scrape complet du tracker chaque jour, pour rien (double
# charge sur my-nft-tracker). Il reste en DISPATCH SEUL comme moniteur a la
# demande : le lancer compare data/elements.csv (v2, ecrit par le daily) a un
# elements_v2.csv reconstruit -> doit rester a identite 0 (auto-coherence).
# Il peut etre SUPPRIME plus tard (a la main, l'upload web n'efface pas).
#
# ⚠️ Quota Sheets partage : a ne pas lancer en meme temps que le daily.

on:
  workflow_dispatch:
    inputs:
      seuil_stable:
        description: "Nb d'ecarts STABLES tolere avant de marquer le run en erreur (0 = tout signaler mais run vert)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: elements-v2-silence
  cancel-in-progress: false

jobs:
  silence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Construire elements_v2.csv (tracker + notes + 2 colonnes entieres)
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m scraper.export_elements_v2

      - name: Comparer au pont v1 (celui que la prod lit)
        env:
          COMPARE_SEUIL_STABLE: ${{ github.event.inputs.seuil_stable || '0' }}
        run: python -m scraper.compare_elements

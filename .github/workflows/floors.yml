name: VeVe floors sync (collectibles)

# Dedicated per-type script: the collectible FLOOR, once a day.
#   priority  -> VeVe floorMarketPrice (only present once a drop is sold out)
#   fallback  -> my-nft-tracker market_lowestOffer
# Appended (on change) to the shared "🟠H-PRIX" history. Edition counters are a
# separate script; this one only touches floor / listings.

on:
  schedule:
    - cron: "10 1 * * *"   # 05:41 UTC, offset from daily.yml (04:11) and the :17 dynamic
  workflow_dispatch:
    inputs:
      max:
        description: "Cap the number of collectibles (0 = all, for a quick test)"
        required: false
        default: "0"

concurrency:
  group: veve-floors
  cancel-in-progress: false

jobs:
  floors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync collectible floors -> 🟠H-PRIX
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          FLOORS_MAX: ${{ github.event.inputs.max || '0' }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
        run: python -m scraper.floors

name: Analytics - cohortes nouveaux entrants

# Fusionne les registres wallet->first_seen (CollectChain astronema + IMX Paolo,
# publics, + le daily local) et ecrit les cohortes par jour/semaine/mois/annee
# dans l'onglet 📊A-COHORTES du Sheet.
#
# /!\ Chiffres EXACTS seulement quand les 2 scans profonds sont TERMINES.
# Avant : apercu (les anciens wallets ont un first_seen encore trop recent).
#
# Lancer a la main quand on veut rafraichir. (Cron mensuel optionnel plus tard.)

on:
  workflow_dispatch:
    inputs:
      registry_urls:
        description: "URLs raw des registres distants (séparées par des virgules ; vide = defaut astronema+Paolo)"
        default: ""

jobs:
  cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      REGISTRY_URLS: ${{ github.event.inputs.registry_urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build cohorts
        run: python -m scraper.cohorts

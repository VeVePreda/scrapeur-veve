name: StackR pseudo sync

on:
  schedule:
    # 05:10 UTC — entre le sync chain (04:40) et le catalogue (05:30).
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      max_lookups:
        description: "Budget d'appels verifiedVeve pour ce run"
        required: false
        default: "200"

concurrency:
  group: stackr-pseudos
  cancel-in-progress: false

jobs:
  pseudos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync pseudo <-> wallet mapping
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          STACKR_MAX_LOOKUPS: ${{ github.event.inputs.max_lookups || '200' }}
          STACKR_COOKIE: ${{ secrets.STACKR_COOKIE }}
        run: python -m scraper.stackr

name: VeVe dynamic data sync (collectibles)

# Refreshes the fast-moving fields (floor / listings / supply / editions) for
# every collectible into the combined "Données Dynamiques" page + the
# PriceHistory / EditionsHistory logs. Comics are handled once a day by the
# catalogue sync.
#
# FREQUENCY vs GitHub free minutes
# --------------------------------
# A private repo gets 2,000 free Action-minutes/month. One dynamic run is
# ~4-6 min. The catalogue/chain/stackr jobs already use ~10 min/day (~300/mo).
#
#   every 3h  (8 runs/day)  ≈  40 min/day  ≈ 1,200 min/mo   ← default, safe
#   every 2h  (12 runs/day) ≈  60 min/day  ≈ 1,800 min/mo   (tight)
#   hourly    (24 runs/day) ≈ 120 min/day  ≈ 3,600 min/mo   (needs paid minutes)
#   2x/day    (07h/19h)     ≈  10 min/day  ≈   300 min/mo   (most discreet)
#
# To change cadence, edit the cron below. Examples:
#   every 3 hours : "17 */3 * * *"     (current)
#   twice a day   : "17 5,17 * * *"
#   hourly        : "17 * * * *"

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Cap the number of collectibles (0 = all, for a quick test)"
        required: false
        default: "0"

concurrency:
  group: veve-dynamic
  cancel-in-progress: false

jobs:
  dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh collectible dynamic data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DYNAMIC_MAX: ${{ github.event.inputs.max || '0' }}
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
        run: python -m scraper.dynamic_run

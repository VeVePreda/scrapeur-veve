name: VeVe dynamic data sync (collectibles)

# Refreshes the FAST-moving fields (floor / listings) for every collectible into
# the "Données Dynamiques" history. Edition counters (slow) are NOT fetched here
# (that GraphQL pass runs once a day inside daily.yml, step 5) — this keeps each
# run light (~2 min, tracker only) and the VeVe request volume low.
#
# FREQUENCY vs GitHub free minutes (2,000/mo on a private repo)
#   every 3h  (8 runs/day)  ≈  16 min/day  ≈  480 min/mo   ← default
#   every 2h  (12 runs/day) ≈  24 min/day  ≈  720 min/mo
#   hourly    (24 runs/day) ≈  48 min/day  ≈ 1,440 min/mo
# Change the cron below to adjust (e.g. "17 5,17 * * *" for twice a day).

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Cap the number of collectibles (0 = all, for a quick test)"
        required: false
        default: "0"

concurrency:
  group: veve-dynamic
  cancel-in-progress: false

jobs:
  dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Refresh collectible floor / listings (tracker only)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          DYNAMIC_MAX: ${{ github.event.inputs.max || '0' }}
          DYNAMIC_WITH_EDITIONS: "false"
          APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
        run: python -m scraper.dynamic_run

name: VeVe daily sync (catalogue + chain + pseudos + market)

# One daily job that runs every step in order:
#   1. catalogue  — cold catalogues + Marques & Licences + brand logos
#   2. chain      — CollectChain activity + DropRevenue + escrow deposits
#   3. stackr     — StackR pseudo <-> wallet resolution (writes Pseudos)
#   4. market     — VeVe market listings + merges sellers into Pseudos
#
# Order matters: market runs LAST so it augments the fresh Pseudos (StackR) and
# uses the same-day escrow deposits from the chain step.
# The fast-moving dynamic data (collectibles) has its own 3-hourly workflow.

on:
  schedule:
    # 04:11 UTC ≈ 06:11 FR (summer). A few minutes past the hour dodges GitHub's
    # heavy on-the-hour scheduling.
    - cron: "11 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: veve-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      APIFY_PROXY_PASSWORD: ${{ secrets.APIFY_PROXY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1) Catalogue (cold + Marques)
        env:
          ENRICH_MODE: new
          WINDOW_DAYS: "8"
          REFRESH_DYNAMIC: "true"
        run: python -m scraper.run

      - name: 2) CollectChain (activity + revenue + escrow)
        if: ${{ always() }}
        env:
          CHAIN_MODE: daily
        run: python -m scraper.chain_run

      - name: 3) StackR pseudos
        if: ${{ always() }}
        env:
          STACKR_MAX_LOOKUPS: "200"
          STACKR_COOKIE: ${{ secrets.STACKR_COOKIE }}
        run: python -m scraper.stackr

      - name: 4) Market listings + pseudo merge
        if: ${{ always() }}
        env:
          VEVE_AUTH: ${{ secrets.VEVE_AUTH }}
          MARKET_MAX_PRODUCTS: "0"
        run: python -m scraper.veve_market

      - name: 5) Dynamic edition counters (daily GraphQL pass)
        if: ${{ always() }}
        env:
          DYNAMIC_WITH_EDITIONS: "true"
        run: python -m scraper.dynamic_run

      - name: 6) Wallet registry (enrich Pseudos with on-chain activity)
        if: ${{ always() }}
        run: python -m scraper.wallet_registry
